<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Expenses</title>
</head>
<body>
  <header class="top">
    <div class="month-nav">
      <button id="prevMonth" class="icon-btn" aria-label="Previous month">&#8249;</button>
      <h1 id="monthLabel">—</h1>
      <button id="nextMonth" class="icon-btn" aria-label="Next month">&#8250;</button>
    </div>
    <div class="total-card">
      <span class="label">Spent this month</span>
      <span id="monthTotal" class="total">0</span>
      <div id="budgetWrap" class="budget" hidden>
        <div class="bar"><div id="budgetFill"></div></div>
        <span id="budgetText"></span>
      </div>
    </div>
  </header>

  <main>
    <section id="view-list" class="view active" aria-label="Expenses">
      <div id="list"></div>
      <p id="empty" class="empty" hidden>No expenses this month.<br>Tap <b>+</b> to add one.</p>
    </section>

    <section id="view-summary" class="view" aria-label="Summary">
      <div id="summary"></div>
    </section>

    <section id="view-settings" class="view" aria-label="Settings">
      <div class="card">
        <h2>Preferences</h2>
        <label class="row">
          <span>Currency symbol</span>
          <input id="setCurrency" type="text" maxlength="4" autocomplete="off">
        </label>
        <label class="row">
          <span>Monthly budget</span>
          <input id="setBudget" type="text" inputmode="decimal" placeholder="none" autocomplete="off">
        </label>
      </div>

      <div class="card">
        <h2>Backup</h2>
        <p class="hint">Your data is stored only on this device. Export a backup now and then.</p>
        <div class="btn-grid">
          <button id="exportJson" class="btn">Export backup (JSON)</button>
          <button id="exportCsv" class="btn">Export CSV</button>
          <label class="btn" for="importFile">Import backup</label>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
      </div>

      <div class="card">
        <h2>Danger zone</h2>
        <button id="deleteAll" class="btn danger">Delete all expenses</button>
      </div>

      <p class="hint center" id="appInfo"></p>
    </section>
  </main>

  <button id="addBtn" class="fab" aria-label="Add expense">+</button>

  <nav class="tabs">
    <button data-view="list" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Expenses</button>
    <button data-view="summary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Summary</button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>

  <dialog id="sheet">
    <form id="form" method="dialog" autocomplete="off">
      <div class="sheet-head">
        <button type="button" id="cancelBtn" class="link">Cancel</button>
        <h2 id="sheetTitle">Add expense</h2>
        <button type="submit" id="saveBtn" class="link strong">Save</button>
      </div>
      <div class="amount-wrap">
        <span id="amountCur"></span>
        <input id="fAmount" type="text" inputmode="decimal" placeholder="0" required>
      </div>
      <div id="fCats" class="chips" role="radiogroup" aria-label="Category"></div>
      <label class="row">
        <span>Date</span>
        <input id="fDate" type="date" required>
      </label>
      <label class="row">
        <span>Note</span>
        <input id="fNote" type="text" maxlength="80" placeholder="optional">
      </label>
      <p id="formError" class="error" hidden></p>
      <button type="button" id="deleteBtn" class="btn danger" hidden>Delete expense</button>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
